name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain (devenv.nix), unless a job
    # picks a devenv profile for another one.
    shell: devenv shell -- bash -e {0}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0

      - name: Type-check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Tests
        run: deno task test

      - name: Build the showcase and the demo
        run: deno task build
